name : 01-Hello World

on: 
  workflow_dispatch:

jobs:
  say-hello:
    runs-on: ubuntu-latest
    steps:
      - name: print a greeting
        run: echo "Hello, Github Actions!"
      - name: printing Multiple lines
        run: |
          echo "This steps runs on several shell commands"
          echo "Today's runner is: $RUNNER_OS"
          echo "The repository is: $GITHUB_REPOSITORY"
